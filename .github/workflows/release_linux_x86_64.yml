name: Build and Release Linux x86_64 Binary

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        run: |
          version="${{ steps.get_version.outputs.VERSION }}"
          version="${version#v}"
          make build GO_LDFLAGS="-X github.com/Justype/condatainer/internal/config.VERSION=${version}"
          mv bin/condatainer_go bin/condatainer_linux_x86_64
        env:
          GOOS: linux
          GOARCH: amd64

      - name: Upload binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: bin/condatainer_linux_x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
